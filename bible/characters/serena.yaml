  - "chỉnh cho mép giấy thẳng hàng với mép bàn trước khi trả lời"
  - "chớp mắt chậm một nhịp dài trước câu quan trọng nhất"

moral_line: "Không ký tên vào một bản án tử hình"

leverage_over:
